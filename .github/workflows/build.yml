                  for (int i = 0; i < NAudio.Wave.WaveInEvent.DeviceCount; i++) cmbMic.Items.Add(NAudio.Wave.WaveInEvent.GetCapabilities(i).ProductName);
                  cmbSpk.Items.Add("Windows Default");
